<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위시 퍼즐</title>
<style>
  /* ===== 색·글씨 설정: 여기 값만 바꿔도 분위기가 바뀌어요 ===== */
  :root{
    --bg:#f2f6ff;          /* 카드 안쪽 연한 칸 색 (연한 하늘색) */
    --card:#ffffff;        /* 카드 색 */
    --main:#2f6bff;        /* 대표 색(파랑) */
    --main-2:#6a5cff;      /* 그라데이션 끝 색(보라빛 파랑) */
    --main-soft:#e6eeff;   /* 연한 파랑 */
    --text:#14172b;
    --sub:#6b7388;
    --warn:#e0561f;
    --ok:#1fa66a;
    --radius:24px;
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  /* 배경: 흰색 바탕에 하늘색·보라색·민트색 빛이 은은하게 번진 느낌 */
  body{margin:0;color:var(--text);font-family:var(--font);line-height:1.5;min-height:100vh;
    background:
      radial-gradient(60% 38% at 12% 0%, rgba(120,170,255,.30), transparent 70%),
      radial-gradient(50% 36% at 100% 18%, rgba(190,160,255,.26), transparent 70%),
      radial-gradient(70% 40% at 50% 100%, rgba(140,230,255,.24), transparent 70%),
      #fbfcff;
    background-attachment:fixed}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  header.top{flex-wrap:wrap;gap:8px}
  #today{font-size:13px;font-weight:700;color:var(--main);background:rgba(255,255,255,.8);border-radius:99px;
    padding:6px 12px;box-shadow:0 4px 12px rgba(60,100,200,.10);white-space:nowrap}
  header.top h1{font-size:24px;margin:0;cursor:pointer;font-weight:800;letter-spacing:-.03em}
  h2{font-size:18px;margin:0 0 12px}
  .card{background:rgba(255,255,255,.88);border-radius:var(--radius);padding:20px 18px;margin-bottom:16px;
    border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(60,100,200,.10);backdrop-filter:blur(8px)}
  .muted{color:var(--sub);font-size:14px}
  .btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--main-soft);color:var(--main)}
  .btn.primary{background:linear-gradient(135deg,var(--main),var(--main-2));color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.28)}
  .btn.danger{background:#ffe9e2;color:var(--warn)}
  .btn.block{display:block;width:100%}
  .btn.small{padding:8px 12px;font-size:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.between{justify-content:space-between}

  /* 홈: 목표 카드 */
  .goal{display:flex;gap:14px;align-items:center;cursor:pointer}
  .goal .info{flex:1;min-width:0}
  .goal .toprow{display:flex;align-items:center;gap:8px}
  .goal a.go{text-decoration:none;white-space:nowrap;padding:5px 10px;font-size:12px;flex:none}
  .goal .name{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:10px;background:var(--main-soft);border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--main-2));border-radius:99px;transition:width .4s}
  .empty{text-align:center;padding:40px 10px}
  .empty .big{font-size:56px}

  /* 퍼즐판: 그림이 뒤에 깔려 있고, 아직 안 연 조각이 그 위(canvas)에서 가려요 */
  .board{position:relative;container-type:inline-size;aspect-ratio:1;background:#fff;
    border-radius:12px;overflow:hidden;border:2px solid var(--main-soft)}
  .board .emoji-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:78cqw;line-height:1}
  .board canvas.cover{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
  .board.mini{width:84px;flex:none;border-width:1px;border-radius:8px}
  .board.big{width:100%;max-width:380px;margin:0 auto}
  .board .emoji-bg.photo{background-size:cover;background-position:center;font-size:0}
  details summary{cursor:pointer;font-weight:700;color:var(--main);margin-top:14px}
  .thumb{width:96px;height:96px;object-fit:cover;border-radius:12px;border:2px solid var(--main-soft);display:block;margin-top:8px}

  /* 상세 */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--bg);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:17px}
  .tag-done{display:inline-block;background:#dff7ec;color:var(--ok);font-weight:800;border-radius:99px;padding:4px 12px;font-size:14px}

  /* 입력 */
  label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
  input[type=text]{width:100%;padding:12px;border:2px solid var(--main-soft);border-radius:12px;font:inherit;background:#fff}
  input[type=text]:focus{outline:none;border-color:var(--main)}
  select,input[type=date]{width:100%;padding:12px;border:2px solid var(--main-soft);border-radius:12px;font:inherit;background:#fff}
  .emojis{display:flex;flex-wrap:wrap;gap:6px}
  .emojis button{font-size:24px;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--bg);cursor:pointer}
  .emojis button.sel{border-color:var(--main);background:var(--main-soft)}
  .note{margin-top:8px;font-size:14px;border-radius:10px;padding:8px 12px;background:var(--bg)}
  .note.warn{background:#fff0ea;color:var(--warn);font-weight:700}
  .err{color:var(--warn);font-size:14px;margin-top:10px;font-weight:700}

  /* 축하 화면 */
  .overlay{position:fixed;inset:0;background:rgba(15,25,60,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  .overlay .box{background:#fff;border-radius:24px;padding:30px 24px;text-align:center;max-width:340px;width:100%;animation:pop .5s}
  .overlay .em{font-size:80px}
  .overlay h2{font-size:30px;margin:8px 0}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  ul.hist{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
  ul.hist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg)}
  .hist .x{border:0;background:var(--bg);color:var(--sub);border-radius:8px;width:28px;height:28px;cursor:pointer;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="logo">💸 위시 퍼즐</h1>
    <span id="today"></span>
  </header>
  <main id="app"></main>
</div>
<div id="modal"></div>

<script>
/* =========================================================
   1. 저장소: 내 브라우저(localStorage)에만 저장해요
   ========================================================= */
const KEY = "can-i-buy-it-v1";
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : []; }
  catch(e){ return []; }
}
let goals = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(goals)); }
  catch(e){ alert("이 브라우저에서는 저장이 막혀 있어요. (시크릿 창이면 일반 창에서 열어 주세요)"); }
}

/* =========================================================
   2. 계산: PRD 4-2, 4-3 규칙 그대로
   ========================================================= */
function addMonths(date, n){
  const d = new Date(date), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return d;
}
function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }   // 2026-12-15 형식
/* 다음 납입일: 이번 달 납입일이 아직 안 지났으면 이번 달, 지났으면 다음 달 (없는 날은 그 달 마지막 날) */
function payDateAt(day, k){          // 앞으로 k번째 납입일 (1번째 = 다음 납입일)
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const mk = (y, m) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
  let start = t.getMonth();
  if(mk(t.getFullYear(), start) < t) start++;          // 이번 달 납입일이 지났으면 다음 달부터
  return mk(t.getFullYear(), start + k - 1);
}
function nextPayText(day){
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = payDateAt(day, 1);
  const diff = Math.round((d - t) / 86400000);
  return `${fmtDate(d)} (${diff === 0 ? "오늘" : diff + "일 뒤"})`;
}
/* ----- 정기납입 자동 기록 -----
   납입일이 지났으면 '매달 모을 돈'을 저금 기록에 자동으로 넣어요.
   g.payStart : 납입일을 정한 날 (이 날짜 '이후'의 납입일부터 세요)
   g.autoDone : 마지막으로 처리한 납입일 (같은 회차를 두 번 넣지 않으려고 기억해요)
   g.autoRound: 몇 회차까지 기록했는지 */
const pad2 = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fmtShort = ts => fmtDate(new Date(ts));                   // 저금 내역 날짜도 2026-12-15 형식
function clampDate(y, m, day){ return new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate())); }
function autoPay(){
  const today = isoOf(new Date());
  let changed = false;
  goals.forEach(g => {
    if(!g.payDay || !(g.monthly > 0)) return;
    if(!g.payStart){ g.payStart = today; changed = true; return; }     // 예전 목표: 오늘부터 세요
    const sy = Number(g.payStart.slice(0, 4)), sm = Number(g.payStart.slice(5, 7)) - 1;
    for(let i = 0; i < 600; i++){                                      // 최대 50년치까지만 살펴봐요
      const d = clampDate(sy, sm + i, g.payDay), iso = isoOf(d);
      if(iso > today) break;                                           // 아직 안 온 납입일
      if(iso <= g.payStart || iso <= (g.autoDone || "")) continue;     // 시작 전이거나 이미 처리함
      g.autoDone = iso; changed = true;
      if(g.saved >= g.target) continue;                                // 이미 다 모았으면 더 쌓지 않아요
      const amount = Math.min(g.monthly, g.target - g.saved);
      g.autoRound = (g.autoRound || 0) + 1;
      g.saved += amount;
      (g.records = g.records || []).push({amount, at: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTime(), auto: true, round: g.autoRound});
    }
  });
  if(changed) save();
}

/* 달성 예정일: 납입일을 정했으면 마지막 납입일, 안 정했으면 오늘 + 걸리는 개월 */
function dateAfter(g, months){
  return g.payDay ? payDateAt(g.payDay, months) : addMonths(new Date(), months);
}
function won(n){ return Number(n).toLocaleString("ko-KR") + "원"; }
function monthsFor(remaining, monthly){
  if(remaining <= 0) return 0;
  if(!(monthly > 0)) return null;
  return Math.ceil(remaining / monthly);          // 소수점 올림
}
function calc(g){
  const remaining = Math.max(0, g.target - g.saved);            // 남은 금액
  const done = g.saved >= g.target;
  const cells = Math.min(100, Math.floor(g.saved * 100 / g.target)); // 채워진 칸
  const months = monthsFor(remaining, g.monthly);               // 걸리는 개월
  return {
    remaining, done, cells, months,
    pct: Math.min(100, g.saved * 100 / g.target),
    cellAmount: g.target / 100,                                 // 칸당 금액
    nextLeft: done ? 0 : Math.ceil(g.target * (cells + 1) / 100 - g.saved), // 다음 칸까지
    date: months === null ? null : dateAfter(g, months)
  };
}

/* =========================================================
   3. 작은 도우미들
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = s => Number(String(s).replace(/[^0-9]/g, "")) || 0;
function commaInput(el){ const n = num(el.value); el.value = n ? n.toLocaleString("ko-KR") : ""; }

/* ----- 퍼즐: 그림을 50×50 = 2,500개 작은 조각으로 나눠 무작위 순서로 열어요 -----
   열린 조각 수 = 전체 조각 × (모은 돈 ÷ 목표 금액). 순서는 목표마다 고정(seed)이라
   저금하면 이미 열린 곳은 그대로 두고 새 조각만 더 열려요. */
const GRID = 50, PX = 8, TOTAL = GRID * GRID;
function seedOf(g){                                // 목표마다 정해진 숫자 (예전 데이터는 id로 만들어요)
  if(g.seed) return g.seed >>> 0;
  let h = 2166136261;
  for(const ch of String(g.id)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return h >>> 0;
}
function rng(seed){                                // 같은 seed면 항상 같은 '무작위' 숫자가 나와요
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const layoutCache = {};
function layout(seed){
  if(layoutCache[seed]) return layoutCache[seed];
  const r = rng(seed), order = Array.from({length: TOTAL}, (_, i) => i);
  for(let i = TOTAL - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const rank = new Int32Array(TOTAL);              // rank[조각] = 몇 번째로 열리는지
  order.forEach((piece, n) => rank[piece] = n);
  const shade = Float32Array.from({length: TOTAL}, () => r());   // 가림막 색이 조금씩 달라 보이게
  return layoutCache[seed] = {rank, shade};
}
function paintPuzzle(cv, g){
  const open = g.saved >= g.target ? TOTAL : Math.floor(g.saved * TOTAL / g.target);  // 열린 조각 수
  const {rank, shade} = layout(seedOf(g)), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  for(let i = 0; i < TOTAL; i++){
    if(rank[i] < open) continue;                   // 열린 조각은 그대로 둬서 그림이 보여요
    ctx.fillStyle = `hsl(${218 + shade[i] * 30} 100% ${85 + shade[i] * 5}%)`;   // 연한 하늘~보라빛 파랑 가림막
    ctx.fillRect((i % GRID) * PX, Math.floor(i / GRID) * PX, PX, PX);
  }
}
function paintAll(){
  document.querySelectorAll("canvas[data-gid]").forEach(cv => {
    const g = goals.find(x => x.id === cv.dataset.gid);
    if(g) paintPuzzle(cv, g);
  });
}

function puzzle(g, size){
  const bg = g.image
    ? `<div class="emoji-bg photo" style="background-image:url('${g.image}')"></div>`   // 사진이 있으면 사진을 깔아요
    : `<div class="emoji-bg">${esc(g.emoji)}</div>`;
  return `<div class="board ${size}">${bg}<canvas class="cover" width="${GRID*PX}" height="${GRID*PX}" data-gid="${esc(g.id)}"></canvas></div>`;
}

/* 링크는 http/https 주소만 허용해요 (이상한 주소는 빈 값) */
function normLink(s){
  s = String(s || "").trim();
  if(!s) return "";
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  try{ const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : ""; }
  catch(e){ return ""; }
}
/* 사진은 가로·세로 최대 480px로 줄여서 저장해요 (저장 공간 절약) */
function shrinkImage(file, done){
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 480 / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      done(c.toDataURL("image/jpeg", 0.85));
    };
    im.onerror = () => done("");
    im.src = rd.result;
  };
  rd.onerror = () => done("");
  rd.readAsDataURL(file);
}

/* =========================================================
   4. 화면 그리기 (주소 뒤 #/ 부분으로 화면을 바꿔요)
   ========================================================= */
/* 화면 맨 위의 오늘 날짜: 2026-11-26 (목) */
function updateToday(){
  const d = new Date();
  $("#today").textContent = `오늘 ${fmtDate(d)} (${"일월화수목금토"[d.getDay()]})`;
}
let current = location.hash;  // 주소(#)가 막힌 환경에서도 화면이 바뀌도록 따로 기억해 둬요
function nav(path){            // 화면 이동: nav("/new") 처럼 써요
  current = "#" + path;
  updateToday();
  try{ location.hash = "#" + path; }catch(e){}
  closeModal(); route(); window.scrollTo(0,0);
}
function route(){
  autoPay();                       // 화면을 그릴 때마다 지난 납입일이 있는지 확인해요
  const h = current.replace(/^#\/?/, "").split("/");
  if(h[0] === "new") return viewForm(null);
  if(h[0] === "edit"){
    const g = goals.find(g => g.id === h[1]);
    return g ? viewForm(g) : nav("/");
  }
  if(h[0] === "goal"){
    const g = goals.find(g => g.id === h[1]);
    return g ? viewDetail(g) : nav("/");
  }
  viewHome();
}
// 브라우저의 뒤로 가기 버튼을 눌렀을 때
window.addEventListener("hashchange", () => {
  if(location.hash === current) return;
  current = location.hash; closeModal(); route(); window.scrollTo(0,0);
});
$("#logo").onclick = () => nav("/");

/* ---------- 홈 ---------- */
function viewHome(){
  let html;
  if(!goals.length){
    html = `<div class="card empty"><div class="big">🧩</div>
      <h2>사고 싶은 게 있나요?</h2>
      <p class="muted">물건과 금액을 넣으면 언제 살 수 있는지 알려줘요.<br>저금할 때마다 퍼즐이 채워져요!</p></div>`;
  } else {
    html = goals.map(g => {
      const c = calc(g);
      return `<div class="card goal" data-go="${esc(g.id)}">
        ${puzzle(g, "mini")}
        <div class="info">
          <div class="toprow">
            <div class="name">${esc(g.emoji)} ${esc(g.name)}</div>
            ${g.link ? `<a class="btn small go" href="${esc(g.link)}" target="_blank" rel="noopener noreferrer">🛒 상품 보러 가기</a>` : ""}
          </div>
          <div class="bar"><i style="width:${c.pct}%"></i></div>
          <div class="muted">${c.done ? "🎉 획득 완료!" : `${Math.floor(c.pct)}% · ${c.months === null ? "모을 금액을 정해 주세요" : c.months + "개월 남음"}`}</div>
        </div>
        <button class="btn danger small" data-del="${esc(g.id)}" aria-label="${esc(g.name)} 삭제">🗑 삭제</button>
        </div>`;
    }).join("");
  }
  $("#app").innerHTML = html + `
    <button class="btn primary block" id="add">＋ 목표 추가</button>
    <div class="row" style="margin-top:14px;justify-content:center">
      <button class="btn small" id="export">백업 저장(내보내기)</button>
      <button class="btn small" id="import">백업 불러오기</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
    <p class="muted" style="text-align:center">데이터는 이 브라우저 안에만 저장돼요. 다른 기기로 옮기려면 백업을 쓰세요.</p>`;
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => nav("/goal/" + el.dataset.go));
  document.querySelectorAll("a.go").forEach(a => a.onclick = e => e.stopPropagation());   // 링크 버튼은 카드 클릭(상세 열기)과 구분
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = e => {
    e.stopPropagation();                       // 카드 전체 클릭(상세 열기)과 구분
    const g = goals.find(x => x.id === b.dataset.del);
    if(g) deleteGoal(g, viewHome);
  });
  $("#add").onclick = () => nav("/new");
  $("#export").onclick = exportData;
  $("#import").onclick = () => $("#file").click();
  $("#file").onchange = importData;
  paintAll();
}

/* ---------- 목표 추가 / 수정 ---------- */
function viewForm(g){
  const editing = !!g;
  g = g || {name:"", emoji:"🎁", target:0, saved:0, income:0, expense:0, monthly:0, reason:"", payDay:0};
  let img = g.image || "";   // 올린 사진 (없으면 빈 값)
  const f = n => n ? Number(n).toLocaleString("ko-KR") : "";
  $("#app").innerHTML = `<div class="card">
    <h2>${editing ? "목표 고치기" : "목표 추가"}</h2>
    <label>사고 싶은 물건</label>
    <input type="text" id="name" maxlength="20" placeholder="예: 노트북" value="${esc(g.name)}">
    <label>사고 싶은 이유 (선택)</label>
    <input type="text" id="reason" maxlength="60" placeholder="예: 취업 준비에 꼭 필요해요" value="${esc(g.reason || "")}">
    <details${g.link || g.image ? " open" : ""}>
      <summary>＋ 링크·사진 추가 (선택)</summary>
      <label>상품 링크</label>
      <input type="text" id="link" placeholder="https://..." value="${esc(g.link || "")}">
      <label>상품 사진</label>
      <div class="row">
        <button type="button" class="btn small" id="pickImg">사진 고르기</button>
        <button type="button" class="btn small danger" id="rmImg" hidden>사진 지우기</button>
        <input type="file" id="imgFile" accept="image/*" hidden>
      </div>
      <div id="imgPrev"></div>
      <p class="muted" style="margin:6px 0 0">사진을 올리면 퍼즐 그림이 돼요. 안 올리면 ${esc(g.emoji)} 그림이 나와요. 사진은 내 브라우저 안에만 저장돼요.</p>
    </details>
    <label>상품 가격 (원)</label>
    <input type="text" id="target" inputmode="numeric" placeholder="1,500,000" value="${f(g.target)}">
    <label>현재 모은 돈 (원)</label>
    <input type="text" id="saved" inputmode="numeric" placeholder="0" value="${f(g.saved)}">
    <label>매달 모을 돈 (원)</label>
    <input type="text" id="monthly" inputmode="numeric" placeholder="300,000" value="${f(g.monthly)}">
    <label>정기납입일 (선택)</label>
    <select id="payDay">
      <option value="0">정하지 않음</option>
      ${Array.from({length: 31}, (_, i) => `<option value="${i + 1}"${g.payDay === i + 1 ? " selected" : ""}>매달 ${i + 1}일</option>`).join("")}
    </select>
    <div class="err" id="err"></div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="saveBtn" style="flex:1">${editing ? "저장" : "만들기"}</button>
      <button class="btn" id="cancel">취소</button>
    </div></div>`;

  // 금액 칸은 입력할 때마다 쉼표를 붙여 줘요
  ["target","saved","monthly"].forEach(id =>
    $("#"+id).addEventListener("input", e => commaInput(e.target)));
  $("#cancel").onclick = () => nav(editing ? "/goal/" + g.id : "/");

  // 사진 고르기 / 지우기
  function showImg(){
    $("#imgPrev").innerHTML = img ? `<img class="thumb" src="${img}" alt="상품 사진 미리보기">` : "";
    $("#rmImg").hidden = !img;
  }
  showImg();
  $("#pickImg").onclick = () => $("#imgFile").click();
  $("#rmImg").onclick = () => { img = ""; showImg(); };
  $("#imgFile").onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    shrinkImage(file, data => {
      if(!data){ $("#err").textContent = "사진을 읽지 못했어요. 다른 사진을 골라 주세요."; return; }
      $("#err").textContent = ""; img = data; showImg();
    });
  };

  $("#saveBtn").onclick = () => {
    const data = {
      name: $("#name").value.trim(),
      emoji: g.emoji || "🎁",          // 이모지 고르기는 없어졌어요. 예전 목표의 이모지는 그대로 둬요
      target: num($("#target").value),
      saved: num($("#saved").value),
      income: g.income || 0,           // 수입·지출 입력은 없어졌어요 (예전 값은 그대로 둬요)
      expense: g.expense || 0,
      monthly: num($("#monthly").value),
      link: normLink($("#link").value),

      reason: $("#reason").value.trim(),
      payDay: Number($("#payDay").value) || 0      // 0이면 정하지 않음
    };
    const err = !data.name ? "물건 이름을 적어 주세요."

      : data.monthly <= 0 ? "매달 모을 돈을 넣어 주세요. (계산에 필요해요)"

      data.payStart = data.payDay ? isoOf(new Date()) : "";
      data.autoDone = "";
    }
    if(editing){ Object.assign(g, data); }
    else { g = Object.assign(data, {id: Date.now().toString(36), records: [], createdAt: Date.now(), seed: Math.floor(Math.random() * 4294967295) + 1}); goals.push(g); }
    save();
    nav("/goal/" + g.id);
  };
}

/* ---------- 목표 상세 ---------- */
function viewDetail(g){
  const c = calc(g);
  const recs = (g.records || []).map((r, i) => ({...r, i}));           // i = 원래 순서(지울 때 씀)
  const autoAll = recs.filter(r => r.auto), manualAll = recs.filter(r => !r.auto);
  const autoList = [...autoAll].sort((a, b) => b.at - a.at || b.round - a.round).slice(0, 5);   // 정기 납입 내역
  const manualList = [...manualAll].sort((a, b) => b.at - a.at).slice(0, 5);   // 상시 납입 내역
  const todayStr = isoOf(new Date());
  const rowHtml = (r, text) => `<li><span>${fmtShort(r.at)} ${text}</span>
    <span><b>+${won(r.amount)}</b><button class="x" data-rm="${r.i}" title="이 항목만 지우기" aria-label="이 항목만 지우기">✕</button></span></li>`;
  // '모두 지우기' + '복원' 버튼 (지운 게 있으면 복원 버튼이 나타나요)
  const trash = g.trash || {};
  const toolsHtml = (kind, total) => (total || (trash[kind] || []).length) ? `<div class="row" style="margin-top:10px">
    ${total ? `<button class="btn small danger" data-clear="${kind}">모두 지우기</button>` : ""}
    ${(trash[kind] || []).length ? `<button class="btn small" data-restore="${kind}">↩ 복원</button>` : ""}</div>` : "";
  $("#app").innerHTML = `
    <div class="card">
      <div class="row between"><h2 style="margin:0">${esc(g.emoji)} ${esc(g.name)}</h2>
        ${c.done ? `<span class="tag-done">획득!</span>` : ""}</div>
      ${g.reason ? `<p style="margin:6px 0 0">💭 ${esc(g.reason)}</p>` : ""}
      <p class="muted" style="margin:4px 0 14px">상품 가격 ${won(g.target)} · 1% = ${won(Math.round(c.cellAmount))}</p>
      ${g.link ? `<p style="margin:0 0 14px"><a class="btn small" style="text-decoration:none;display:inline-block" href="${esc(g.link)}" target="_blank" rel="noopener noreferrer">🛒 상품 보러 가기</a></p>` : ""}
      ${puzzle(g, "big")}
      <div class="bar" style="height:14px;margin-top:14px"><i style="width:${c.pct}%"></i></div>
      <div class="row between muted"><span>${Math.floor(c.pct)}% 열었어요</span><span>${won(g.saved)} 모음</span></div>
      <p class="muted" style="margin:8px 0 0">${c.done ? "🎉 그림을 모두 열었어요!" : `다음 1%까지 <b>${won(c.nextLeft)}</b> 남았어요`}</p>
      <div class="stats">
        <div class="stat"><span class="muted">걸리는 기간</span><b>${c.done ? "달성!" : c.months + "개월"}</b></div>
        <div class="stat"><span class="muted">달성 예정일</span><b>${c.done ? "-" : fmtDate(c.date)}</b></div>
        <div class="stat"><span class="muted">남은 금액</span><b>${won(c.remaining)} (${Math.ceil(c.remaining * 100 / g.target)}%)</b></div>
        <div class="stat"><span class="muted">매달 모을 돈</span><b>${won(g.monthly)}</b></div>
        ${g.payDay && !c.done ? `<div class="stat"><span class="muted">정기납입일</span><b>매달 ${g.payDay}일</b></div>
        <div class="stat"><span class="muted">다음 납입일</span><b style="font-size:15px">${nextPayText(g.payDay)}</b></div>` : ""}
      </div>
    </div>

    <div class="card">
      <h2>정기 납입</h2>
      ${g.payDay ? `
        <p class="muted" style="margin:0">매달 ${g.payDay}일 · ${won(g.monthly)}씩 자동 기록${c.done ? "" : ` · 다음 납입일 ${nextPayText(g.payDay)}`}</p>
        ${autoList.length
          ? `<ul class="hist">${autoList.map(r => rowHtml(r, `정기납입 ${r.round}회차`)).join("")}</ul>`
          : `<p class="muted" style="margin:10px 0 0">아직 지난 납입일이 없어요.</p>`}
        <p class="muted" style="margin:8px 0 0">납입일이 지나면 저절로 기록돼요. 실제로 저금하지 못했다면 ✕를 눌러 지워 주세요.</p>`
      : `<p class="muted" style="margin:0 0 10px">정기납입일을 정하면 납입일마다 매달 모을 돈이 자동으로 기록돼요.</p>
        <button class="btn small" id="setPay">정기납입일 정하기</button>`}
      ${toolsHtml("auto", autoAll.length)}
    </div>

    <div class="card">
      <h2>상시 납입</h2>
      <p class="muted" style="margin:0">용돈이나 알바비처럼 정해진 날이 아닐 때 모은 돈을 기록해요.</p>
      <label style="margin-top:12px">날짜</label>
      <input type="date" id="recDate" value="${todayStr}" max="${todayStr}">
      <label>항목 (선택)</label>
      <input type="text" id="recLabel" maxlength="20" placeholder="예: 용돈, 알바비">
      <label>금액 (원)</label>
      <input type="text" id="amt" inputmode="numeric" placeholder="모은 금액">
      <button class="btn primary block" id="rec" style="margin-top:12px">기록</button>
      <div class="err" id="recErr"></div>
      ${manualList.length
        ? `<ul class="hist">${manualList.map(r => rowHtml(r, esc(r.label || "상시 납입"))).join("")}</ul>`
        : `<p class="muted" style="margin:10px 0 0">아직 기록이 없어요.</p>`}
      ${toolsHtml("manual", manualAll.length)}
    </div>

    ${c.done ? "" : `<div class="card">
      <h2>금액 바꿔 보기</h2>
      <p class="muted" style="margin-top:0">매달 모을 돈을 바꾸면 기간이 어떻게 달라질까요?</p>
      <input type="text" id="what" inputmode="numeric" value="${g.monthly.toLocaleString("ko-KR")}">
      <div class="row" style="margin-top:8px">
        <button class="btn small" data-add="50000">+5만원</button>
        <button class="btn small" data-add="100000">+10만원</button>
        <button class="btn small" data-add="-50000">−5만원</button>
      </div>
      <div class="note" id="whatOut"></div>
    </div>`}

    <div class="row">
      <button class="btn" id="edit">목표 고치기</button>
      <button class="btn danger" id="del">삭제</button>
      <button class="btn" id="back" style="margin-left:auto">← 홈</button>
    </div>`;

  paintAll();
  $("#back").onclick = () => nav("/");
  $("#edit").onclick = () => nav("/edit/" + g.id);
  $("#del").onclick = () => deleteGoal(g, () => nav("/"));

  $("#amt").addEventListener("input", e => commaInput(e.target));
  $("#rec").onclick = () => {
    const a = num($("#amt").value), day = $("#recDate").value;
    if(!day || day > todayStr){ $("#recErr").textContent = "날짜를 확인해 주세요. 오늘까지만 고를 수 있어요."; return; }
    if(a <= 0){ $("#recErr").textContent = "금액을 1원 이상 넣어 주세요."; return; }
    const [y, m, d] = day.split("-").map(Number);
    const wasDone = calc(g).done;
    g.saved += a;
    (g.records = g.records || []).push({amount: a, at: new Date(y, m - 1, d, 12).getTime(), label: $("#recLabel").value.trim()});
    save();
    viewDetail(g);
    if(!wasDone && calc(g).done) celebrate(g);
  };
  // 지우기 / 복원: 지운 기록은 g.trash에 종류별(auto/manual)로 쌓아 두고 '복원'으로 되돌려요
  const kindOf = r => r.auto ? "auto" : "manual";
  const stash = (kind, batch) => {
    g.trash = g.trash || {};
    (g.trash[kind] = g.trash[kind] || []).push(batch);
    if(g.trash[kind].length > 10) g.trash[kind].shift();          // 최근 10번까지만 기억해요
  };
  const sumOf = list => list.reduce((s, r) => s + r.amount, 0);
  // ✕ : 이 항목만 지우기
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const idx = Number(b.dataset.rm), r = g.records[idx];
    if(!r) return;
    stash(kindOf(r), [r]);
    g.records.splice(idx, 1);
    g.saved = Math.max(0, g.saved - r.amount);
    save(); viewDetail(g);
  });
  // 모두 지우기
  document.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => {
    const kind = b.dataset.clear, batch = g.records.filter(r => kindOf(r) === kind);
    if(!batch.length) return;
    askConfirm(`${kind === "auto" ? "정기 납입" : "상시 납입"} 기록을 모두 지울까요?`,
      `기록 ${batch.length}개(합계 ${won(sumOf(batch))})가 지워지고 모은 돈에서도 빠져요. 지운 뒤 '복원'으로 되돌릴 수 있어요.`, "모두 지우기", () => {
        stash(kind, batch);
        g.records = g.records.filter(r => kindOf(r) !== kind);
        g.saved = Math.max(0, g.saved - sumOf(batch));
        save(); viewDetail(g);
      });
  });
  // 복원: 가장 최근에 지운 것부터 되돌려요
  document.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => {
    const batch = ((g.trash || {})[b.dataset.restore] || []).pop();
    if(!batch) return;
    g.records.push(...batch);
    g.saved += sumOf(batch);
    save(); viewDetail(g);
  });
  if($("#setPay")) $("#setPay").onclick = () => nav("/edit/" + g.id);

  // 금액 바꿔 보기
  if($("#what")){
    const out = () => {
      const m = num($("#what").value);
      if(m <= 0){ $("#whatOut").textContent = "0원보다 큰 금액을 넣어 주세요."; return; }
      const nm = monthsFor(c.remaining, m), diff = c.months - nm;
      const delta = m - g.monthly;
      $("#whatOut").innerHTML = `매달 <b>${won(m)}</b> 모으면 <b>${nm}개월</b> (${fmtDate(dateAfter(g, nm))})<br>` +
        (diff > 0 ? `👉 지금보다 <b>${diff}개월 빨라져요</b>` + (delta > 0 ? ` (매달 ${won(delta)} 더 모으면)` : "")
         : diff < 0 ? `지금보다 ${-diff}개월 늦어져요` : "지금과 걸리는 기간이 같아요");
    };
    $("#what").addEventListener("input", e => { commaInput(e.target); out(); });
    document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
      const v = Math.max(0, num($("#what").value) + Number(b.dataset.add));
      $("#what").value = v ? v.toLocaleString("ko-KR") : ""; out();
    });
    out();
  }
}

/* ---------- 축하 화면 ---------- */
function celebrate(g){
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="box">
    <div class="em">${esc(g.emoji)}</div><h2>🎉 획득!</h2>
    <p><b>${esc(g.name)}</b> 퍼즐을 모두 채웠어요.<br>이제 살 수 있어요!</p>
    <button class="btn primary block" id="closeOv">확인</button></div></div>`;
  $("#closeOv").onclick = closeModal;
}
function closeModal(){ $("#modal").innerHTML = ""; }

/* 화면 안에 뜨는 확인 창 (브라우저 기본 confirm 창은 막히는 곳이 있어서 직접 만들었어요) */
function askConfirm(title, msg, okLabel, onOk){
  $("#modal").innerHTML = `<div class="overlay"><div class="box">
    <h2 style="font-size:22px">${esc(title)}</h2><p>${esc(msg)}</p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="cNo">취소</button>
      <button class="btn danger" id="cYes">${esc(okLabel)}</button></div></div></div>`;
  $("#cNo").onclick = closeModal;
  $("#cYes").onclick = () => { closeModal(); onOk(); };
}
/* 목표 삭제: 홈과 상세 화면이 같이 써요 */
function deleteGoal(g, after){
  askConfirm("목표를 삭제할까요?", `"${g.name}" 목표와 저금 기록이 모두 사라지고, 되돌릴 수 없어요.`, "삭제", () => {
    goals = goals.filter(x => x.id !== g.id);
    save();
    after();
  });
}

/* =========================================================
   5. 내보내기 / 불러오기
   ========================================================= */
function exportData(){
  const blob = new Blob([JSON.stringify(goals, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `위시퍼즐-백업-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const arr = JSON.parse(rd.result);
      if(!Array.isArray(arr)) throw 0;
      const clean = arr.map(x => {
        const t = Math.max(0, Number(x.target) || 0);
        if(!x.name || t <= 0) throw 0;
        return { id: String(x.id || Math.random().toString(36).slice(2)), name: String(x.name).slice(0,20),
          emoji: String(x.emoji || "🎁").slice(0,4), target: t, saved: Math.max(0, Number(x.saved)||0),
          income: Math.max(0, Number(x.income)||0), expense: Math.max(0, Number(x.expense)||0),
          monthly: Math.max(0, Number(x.monthly)||0),
          seed: Number.isInteger(x.seed) && x.seed > 0 ? x.seed : 0,
          reason: String(x.reason || "").slice(0, 60),
          payDay: Number.isInteger(x.payDay) && x.payDay >= 1 && x.payDay <= 31 ? x.payDay : 0,
          link: normLink(x.link),
          image: /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(x.image || "") ? x.image : "",
          records: Array.isArray(x.records) ? x.records.map(r => ({amount:Number(r.amount)||0, at:Number(r.at)||Date.now(), auto:!!r.auto, round:Number(r.round)||0, label:String(r.label||"").slice(0,20)})) : [],
          payStart: /^\d{4}-\d{2}-\d{2}$/.test(x.payStart || "") ? x.payStart : "",
          autoDone: /^\d{4}-\d{2}-\d{2}$/.test(x.autoDone || "") ? x.autoDone : "",
          autoRound: Math.max(0, Number(x.autoRound) || 0),
          createdAt: Number(x.createdAt) || Date.now() };
      });
      askConfirm("백업을 불러올까요?", `백업 파일의 목표 ${clean.length}개로 지금 데이터를 바꿔요. 현재 데이터는 사라져요.`, "불러오기", () => {
        goals = clean; save(); route();
      });
    }catch(err){ alert("올바른 백업 파일이 아니에요. '백업 저장'으로 만든 파일을 골라 주세요."); }
  };
  rd.readAsText(file);
}

updateToday();
window.addEventListener("focus", updateToday);   // 창으로 돌아올 때마다 날짜를 새로 확인해요
route();
</script>
